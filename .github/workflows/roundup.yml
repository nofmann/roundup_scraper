name: Alta roundup

on:
  schedule:
    - cron: "3 * * * *"   # 7 minutes past every hour (UTC clock, same minute everywhere)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: roundup
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::httr any::dplyr any::tidyr any::readr any::ggplot2 any::patchwork any::scales any::base64enc any::ragg any::jsonlite

      - name: Scrape and build report
        run: Rscript roundup.R

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alta_hourly.csv
          git diff --cached --quiet || (git commit -m "Update hourly data" && git push)

      - name: Prepare site
        run: cp output/roundup.html output/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
